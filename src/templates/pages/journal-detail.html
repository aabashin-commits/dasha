<section class="wrap page-hero" data-keyframe="Статья">
  {{> breadcrumbs }}
  <p class="slug page-hero__slug" style="margin-top:var(--sp-6)">
    <span class="slug__mark" aria-hidden="true">◆</span>
    <span><time datetime="{{ article.date }}">{{ article.date | date }}</time></span>
    <span>{{ minutes }} мин чтения</span>
    <span>{{ article.author }}</span>
  </p>
  <h1 class="h1 page-hero__title" style="max-width:22ch">{{ article.title }}</h1>
  <p class="lead page-hero__lead">{{ article.excerpt }}</p>
</section>

<div class="wrap">
  <div class="article-cover reveal">
    <picture>
      <source srcset="{{ article.coverWebp }}" type="image/webp">
      <img class="article-cover__img" src="{{ article.cover }}" alt="{{ article.coverAlt }}"
           width="1600" height="900" fetchpriority="high" decoding="async">
    </picture>
    <span class="grain" aria-hidden="true"></span>
  </div>

  <article class="article reveal">
    {{{ bodyHtml }}}
  </article>
</div>

<hr class="rule" style="margin-top:var(--sp-9)">

<section class="wrap band" data-keyframe="Ещё">
  <div class="section-head reveal">
    <div class="section-head__text">
      <p class="slug">
        <span class="slug__mark" aria-hidden="true">◆</span>
        <span>Читать дальше</span>
      </p>
      <h2 class="h2 section-head__title">Ещё из журнала</h2>
    </div>
    <a class="btn" href="/journal/">Все статьи <span class="btn__arrow" aria-hidden="true">→</span></a>
  </div>

  <div class="journal-grid reveal">
    {{#each more}}
    {{> journal-card }}
    {{/each}}
  </div>
</section>

{{> cta-section }}
