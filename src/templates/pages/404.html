<section class="wrap page-hero" data-keyframe="404">
  <p class="slug page-hero__slug">
    <span class="slug__mark" aria-hidden="true">◆</span>
    <span>Ошибка 404</span><span>кадр не найден</span>
  </p>
  <h1 class="display page-hero__title">Такого кадра нет</h1>
  <p class="lead page-hero__lead">
    Страница не существует или переехала. Ниже — то, ради чего сюда
    обычно приходят.
  </p>
  <div class="page-hero__actions">
    <a class="btn btn--primary" href="/">На главную <span class="btn__arrow" aria-hidden="true">→</span></a>
    <a class="btn" href="/works/">Работы <span class="btn__arrow" aria-hidden="true">→</span></a>
    <a class="btn" href="/services/">Направления <span class="btn__arrow" aria-hidden="true">→</span></a>
  </div>
</section>

<div class="wrap band band--flush-top">
  <div class="works">
    {{#each works}}
    {{> work-card }}
    {{/each}}
  </div>
</div>
