<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{{ head }}}

  <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0A0B0C">

  <!-- Кириллические начертания основного текста и заголовков: они нужны
       для первого экрана, остальное подтянется по font-display:swap -->
  <link rel="preload" href="/fonts/golos-text-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/unbounded-700-cyrillic.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="{{ assets.css }}">
  {{{ jsonLd }}}
</head>
<body
  data-analytics="{{#if site.analytics.enabled}}on{{else}}off{{/if}}"
  data-metrika="{{ site.analytics.yandexMetrikaId }}"
  data-ga4="{{ site.analytics.ga4Id }}">

<!-- Ставит .js на <html> до отрисовки. Правило `.js .reveal{opacity:0}`
     завязано на этот класс: без него отказ JavaScript оставил бы
     пустую страницу вместо читаемого текста. -->
<script>document.documentElement.classList.add('js')</script>

<a class="skip" href="#main">К основному содержанию</a>

{{> spine }}

<div class="shell">
  {{> site-header }}
  {{> site-menu }}

  <main id="main">
{{{ content }}}
  </main>

  {{> site-footer }}
</div>

<script type="module" src="{{ assets.js }}"></script>
</body>
</html>
