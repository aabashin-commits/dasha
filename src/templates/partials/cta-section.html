<!-- Сквозной блок заявки. Стоит в конце каждой содержательной страницы:
     решение обсудить проект чаще всего созревает после чтения, а не до. -->
<section class="wrap band" id="contact" data-keyframe="Контакт">
  <div class="cta reveal">
    <div>
      <p class="slug">
        <span class="slug__mark" aria-hidden="true">◆</span>
        <span>Контакт</span>
      </p>
      <h2 class="h2 cta__title">Расскажите, что нужно снять</h2>
      <p class="muted">
        Ответим в течение рабочего дня. Если проект срочный —
        пишите в Telegram, там быстрее.
      </p>
      <div class="cta__links">
        <a class="btn" href="https://t.me/{{ site.contacts.telegram }}" data-track="click_telegram">
          Telegram <span class="btn__arrow" aria-hidden="true">→</span>
        </a>
        <a class="btn" href="mailto:{{ site.contacts.email }}" data-track="click_email">
          {{ site.contacts.email }}
        </a>
      </div>
    </div>

    {{> lead-form }}
  </div>
</section>
