<!-- visibility:hidden убирает меню из таб-порядка и дерева доступности,
     поэтому атрибут hidden не нужен и не ломает переход -->
<div class="menu" id="menu" data-menu>
  <nav class="menu__list" aria-label="Мобильная навигация">
    {{#each site.menu}}
    <a class="menu__link" href="{{ url }}">{{ title }}</a>
    {{/each}}
  </nav>
  <p class="slug menu__footer">
    <span>{{ site.tagline }}</span>
    <span>{{ site.city }}</span>
    <span>{{ site.contacts.email }}</span>
  </p>
</div>
