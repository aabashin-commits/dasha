<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div>
      <a class="logo" href="/">
        <span class="logo__mark" aria-hidden="true"></span>{{ site.name }}
      </a>
      <p class="slug site-footer__meta">
        <span>{{ site.tagline }}</span>
        <span>{{ site.city }}</span>
      </p>
    </div>

    <nav class="site-footer__nav" aria-label="Навигация в подвале">
      {{#each site.menu}}
      <a class="site-nav__link" href="{{ url }}">{{ title }}</a>
      {{/each}}
    </nav>

    <div>
      <p class="slug"><span class="slug__mark">◆</span><span>Связаться</span></p>
      <p class="site-footer__meta">
        <a href="mailto:{{ site.contacts.email }}">{{ site.contacts.email }}</a><br>
        <a href="https://t.me/{{ site.contacts.telegram }}">@{{ site.contacts.telegram }}</a>
      </p>
    </div>

    <p class="site-footer__legal">
      © 2026 {{ site.name }}. {{ site.legalName }}.
      <a href="/privacy/">Политика обработки персональных данных</a>
    </p>
  </div>
</footer>
