<a class="work-card {{ position }}" href="/works/{{ slug }}/" data-work-service="{{ service }}">
  <span class="work-card__media {{ ratioClass }}">
    <picture>
      <source type="image/avif" srcset="{{ posterSrcsetAvif }}"
              sizes="(min-width: 1100px) 40vw, (min-width: 760px) 50vw, 100vw">

      <source type="image/webp" srcset="{{ posterSrcsetWebp }}"
              sizes="(min-width: 1100px) 40vw, (min-width: 760px) 50vw, 100vw">
      <img class="work-card__img" src="{{ poster }}" srcset="{{ posterSrcset }}"
           sizes="(min-width: 1100px) 40vw, (min-width: 760px) 50vw, 100vw"
           alt="{{ title }} — кадр из работы"
           loading="lazy" decoding="async"
           width="{{ posterWidth }}" height="{{ posterHeight }}">
    </picture>
    <span class="grain" aria-hidden="true"></span>
    <span class="work-card__line" aria-hidden="true"></span>
  </span>
  <span class="work-card__caption">
    <span class="work-card__title">{{ title }}</span>
    <span class="work-card__meta">{{ serviceTitle }}<br>{{ ratio }} · {{ year }}</span>
  </span>
</a>
