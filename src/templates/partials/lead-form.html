<form class="lead-form" data-lead-form action="{{ site.form.endpoint }}" method="post" novalidate>
  <div class="field">
    <label class="field__label" for="lead-name">Как вас зовут</label>
    <input class="field__control" id="lead-name" name="name" type="text"
           autocomplete="name" required placeholder="Имя">
    <p class="field__error" data-error-for="name"></p>
  </div>

  <div class="field">
    <label class="field__label" for="lead-contact">Telegram, телефон или почта</label>
    <input class="field__control" id="lead-contact" name="contact" type="text"
           required placeholder="@username">
    <p class="field__error" data-error-for="contact"></p>
  </div>

  <div class="field">
    <label class="field__label" for="lead-service">Направление</label>
    <select class="field__control" id="lead-service" name="service">
      <option value="">Ещё не решили</option>
      {{#each services}}
      <option value="{{ slug }}">{{ title }}</option>
      {{/each}}
    </select>
  </div>

  <div class="field">
    <label class="field__label" for="lead-message">Что нужно снять</label>
    <textarea class="field__control" id="lead-message" name="message"
              placeholder="Пара предложений о задаче и сроках"></textarea>
    <p class="field__error" data-error-for="message"></p>
  </div>

  <!-- Ханипот: скрыт позиционированием, а не display:none — часть ботов
       пропускает поля именно по display:none -->
  <div class="field field--trap" aria-hidden="true">
    <label for="lead-company">Не заполняйте это поле</label>
    <input id="lead-company" name="company" type="text" tabindex="-1" autocomplete="off">
  </div>

  <label class="consent">
    <input class="consent__box" name="consent" type="checkbox" value="1" required>
    <span>Согласен на обработку персональных данных
      и принимаю <a href="/privacy/">политику конфиденциальности</a></span>
  </label>

  <button class="btn btn--primary btn--wide" type="submit" data-submit>
    <span data-submit-text>Отправить заявку</span>
    <span class="btn__arrow" aria-hidden="true">→</span>
  </button>

  <div class="form__status" data-form-status role="status" aria-live="polite"></div>
</form>
